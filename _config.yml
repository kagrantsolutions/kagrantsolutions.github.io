title: KA Grant Solutions
email: kagrantsolutions@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Homepage for KA Grant Solutions, a nonprofit development consulting company in Chicago.
baseurl: "kagrantsolutions.com"
url: "https://kagrantsolutions.com"
github_username:  kagrantsolutions

# Build settings
remote_theme: chrisrhymes/bulma-clean-theme
plugins:
  - jekyll-feed

# Required by github pages
lsi: false
safe: true
source: /
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

